<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometria epipolar - Visão Robótica</title>
<style>
  :root {
    --painel: rgba(255, 255, 255, 0.92);
    --borda: #c9c9d1;
    --texto: #222;
    --destaque: #7a1f4b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Source Sans Pro", "Helvetica Neue", Arial, sans-serif;
    color: var(--texto); background: #f4f4f6;
  }
  #cena { position: absolute; inset: 0; }
  #cena canvas { display: block; }

  #painel {
    position: absolute; top: 10px; left: 10px; width: 252px;
    padding: 10px 12px; background: var(--painel);
    border: 1px solid var(--borda); border-radius: 8px;
    font-size: 13px; line-height: 1.3; user-select: none;
  }
  #painel h1 { font-size: 15px; margin: 0 0 8px; color: var(--destaque); }
  .secao { font-size: 12px; color: #555; margin-top: 8px; }
  .linha { display: flex; gap: 6px; align-items: center; margin: 4px 0 6px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 12px; padding: 3px 7px; cursor: pointer;
    border: 1px solid var(--borda); border-radius: 5px; background: #fff;
  }
  button.ativo { background: var(--destaque); border-color: var(--destaque); color: #fff; }
  button:disabled { opacity: 0.4; cursor: default; }
  .mat { font-family: "Cambria Math", "Latin Modern Math", serif; font-style: italic; }
  #info { font-size: 12px; color: #444; margin-top: 8px; font-variant-numeric: tabular-nums; }
  #info td { padding: 1px 4px 1px 0; vertical-align: top; }

  #imagens {
    position: absolute; right: 10px; bottom: 10px; display: flex; gap: 8px;
    width: 46%; max-width: 620px; min-width: 360px;
  }
  .imagem {
    flex: 1; background: var(--painel); border: 1px solid var(--borda); border-radius: 8px; padding: 6px;
  }
  .imagem .titulo { font-size: 12px; color: #444; margin: 0 2px 4px; display: flex; justify-content: space-between; }
  .imagem canvas { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 3px; }

  #dica {
    position: absolute; right: 10px; top: 10px; max-width: 45%; text-align: right;
    font-size: 12px; color: #555; background: rgba(255,255,255,0.75);
    padding: 3px 8px; border-radius: 5px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="cena"></div>

<div id="painel">
  <h1>Geometria epipolar</h1>

  <div class="secao">Selecionar</div>
  <div class="linha">
    <button id="sel-X" class="ativo">Ponto <span class="mat">X</span></button>
    <button id="sel-C1">Câmera <span class="mat">C</span></button>
    <button id="sel-C2">Câmera <span class="mat">C′</span></button>
  </div>
  <div class="linha">
    <button id="modo-mover" class="ativo">Mover</button>
    <button id="modo-girar" disabled>Girar</button>
  </div>

  <div class="secao">Exibir</div>
  <div class="linha">
    <button id="ver-plano" class="ativo">Plano epipolar</button>
    <button id="ver-linhas" class="ativo">Linhas epipolares</button>
  </div>
  <div class="linha">
    <button id="resetar">Resetar</button>
  </div>

  <table id="info"></table>
</div>

<div id="imagens">
  <div class="imagem">
    <div class="titulo"><span>Imagem da câmera <span class="mat">C</span></span><span>640 × 480 px</span></div>
    <canvas id="img1" width="640" height="480"></canvas>
  </div>
  <div class="imagem">
    <div class="titulo"><span>Imagem da câmera <span class="mat">C′</span></span><span>640 × 480 px</span></div>
    <canvas id="img2" width="640" height="480"></canvas>
  </div>
</div>

<div id="dica">Arrastar o fundo: rotacionar a vista<br>
               Botão direito do mouse: deslocar a vista<br>
               Roda do mouse: zoom <br><br>
               Clique em um objeto para selecioná-lo <br>
               Arraste os eixos do objeto para movê-lo ou girá-lo</div>

<!-- Three.js r187 (MIT) + OrbitControls + TransformControls, empacotados localmente para funcionar sem internet -->
<script src="lib/three.min.js"></script>
<script>
(() => {
const { OrbitControls, TransformControls } = THREE;

// ---------------------------------------------------------------------------
// Convenção de coordenadas de cada câmera (visão computacional):
//   X para a direita, Y para baixo, Z para frente (eixo óptico)
// O mundo usa a mesma orientação (Y para baixo); o observador usa "up" = -Y.
// As duas câmeras têm os mesmos parâmetros intrínsecos K.
// ---------------------------------------------------------------------------
const W = 640, H = 480;
const K = { fx: 500, fy: 500, cx: 320, cy: 240 };
const D_PLANO = 0.6;              // profundidade em que o plano imagem é desenhado
const LIMITE_EPIPOLO = 3;         // epipolos a mais de 3 unidades do centro óptico não são desenhados em 3D

const COR = {
  c1: '#7a1f4b',     // câmera C (mesma cor do tronco de visão da demo de projeção)
  c2: '#1f5f8b',     // câmera C'
  ponto: '#33384a',
  epi: '#e07b00',    // epipolos e linhas epipolares
  plano: '#f2b134',  // plano epipolar
  base: '#222222'
};

const INICIAL = {
  X:  new THREE.Vector3(0.3, -0.3, 4.5),
  C1: new THREE.Vector3(-0.9, 0, 0),
  C2: new THREE.Vector3(0.9, -0.2, 1.6),
  alvo: new THREE.Vector3(0, -0.1, 4.5)
};

// Renderizador, cena e observador -------------------------------------------------
const container = document.getElementById('cena');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0xf4f4f6);
container.appendChild(renderer.domElement);

const cena = new THREE.Scene();
const observador = new THREE.PerspectiveCamera(45, 1, 0.05, 200);
observador.up.set(0, -1, 0);
observador.position.set(-2.2, -3.8, -3.8);

const orbita = new OrbitControls(observador, renderer.domElement);
orbita.target.set(1.4, 0.9, 2.4);
orbita.enableDamping = true;
orbita.update();

cena.add(new THREE.AmbientLight(0xffffff, 0.8));
const luz = new THREE.DirectionalLight(0xffffff, 0.8);
luz.position.set(-3, -5, -2);
cena.add(luz);

const grade = new THREE.GridHelper(20, 40, 0xb8b8c4, 0xdcdce4);
grade.position.set(0, 1.6, 3);
cena.add(grade);

// Rótulos de texto -----------------------------------------------------------------
function rotulo(texto, cor, altura = 0.3, italico = true) {
  const px = 96;
  const fonte = `${italico ? 'italic ' : ''}600 ${px}px "Cambria Math", "Times New Roman", serif`;
  const c = document.createElement('canvas');
  const medida = c.getContext('2d');
  medida.font = fonte;
  c.width = Math.ceil(medida.measureText(texto).width + px * 0.4);
  c.height = Math.ceil(px * 1.3);
  const ctx = c.getContext('2d');
  ctx.font = fonte;
  ctx.fillStyle = cor;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(texto, c.width / 2, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(altura * c.width / c.height, altura, 1);
  sp.renderOrder = 10;
  return sp;
}

function linha(cor, opcoes = {}) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(3 * (opcoes.n || 2)), 3));
  const mat = opcoes.tracejada
    ? new THREE.LineDashedMaterial({ color: cor, dashSize: 0.12, gapSize: 0.08, transparent: true, opacity: opcoes.opacidade ?? 1 })
    : new THREE.LineBasicMaterial({ color: cor, transparent: true, opacity: opcoes.opacidade ?? 1 });
  const l = new THREE.Line(geo, mat);
  l.frustumCulled = false;
  return l;
}
function definirLinha(l, a, b) {
  const p = l.geometry.attributes.position;
  p.setXYZ(0, a.x, a.y, a.z); p.setXYZ(1, b.x, b.y, b.z);
  p.needsUpdate = true;
  if (l.material.isLineDashedMaterial) l.computeLineDistances();
}

// Câmeras ----------------------------------------------------------------------------
const pegaveis = [];

function cantosLocais(z) {
  return [[0, 0], [W, 0], [W, H], [0, H]].map(([u, v]) =>
    new THREE.Vector3((u - K.cx) / K.fx * z, (v - K.cy) / K.fy * z, z));
}

function criarCamera(id, nome, cor, sufixo) {
  const g = new THREE.Group();
  // up padrão (0, 1, 0): com lookAt, o y local fica alinhado a +Y do mundo (para baixo)
  cena.add(g);

  // eixos do sistema de coordenadas da câmera
  [[new THREE.Vector3(1, 0, 0), 0xd62728], [new THREE.Vector3(0, 1, 0), 0x2ca02c], [new THREE.Vector3(0, 0, 1), 0x1f77b4]]
    .forEach(([d, c]) => g.add(new THREE.ArrowHelper(d, new THREE.Vector3(), 0.45, c, 0.1, 0.05)));

  const centro = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 20), new THREE.MeshLambertMaterial({ color: cor }));
  centro.userData.alvo = id;
  g.add(centro);
  pegaveis.push(centro);

  const r = rotulo(nome, cor, 0.3);
  r.position.set(-0.22, -0.22, 0);
  g.add(r);

  // tronco de visão e plano imagem
  const cantos = cantosLocais(D_PLANO);
  const pts = [];
  cantos.forEach(c => pts.push(new THREE.Vector3(), c));
  cantos.forEach((c, k) => pts.push(c, cantos[(k + 1) % 4]));
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: cor })));

  const geoPlano = new THREE.BufferGeometry().setFromPoints(cantos);
  geoPlano.setIndex([0, 1, 2, 0, 2, 3]);
  const plano = new THREE.Mesh(geoPlano, new THREE.MeshBasicMaterial({
    color: cor, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false
  }));
  plano.userData.alvo = id;
  g.add(plano);
  pegaveis.push(plano);

  // projeção do ponto X, epipolo e linha epipolar (em coordenadas locais da câmera)
  const projX = new THREE.Mesh(new THREE.SphereGeometry(0.025, 12, 12), new THREE.MeshBasicMaterial({ color: cor }));
  g.add(projX);
  const rotX = rotulo('x' + sufixo, cor, 0.16);
  g.add(rotX);

  const epipolo = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), new THREE.MeshBasicMaterial({ color: COR.epi }));
  g.add(epipolo);
  const rotE = rotulo('e' + sufixo, COR.epi, 0.2);
  g.add(rotE);

  const linhaEpi = linha(COR.epi);
  linhaEpi.material.linewidth = 2;
  g.add(linhaEpi);

  return { id, grupo: g, cor, sufixo, projX, rotX, epipolo, rotE, linhaEpi };
}

const cam1 = criarCamera('C1', 'C', COR.c1, '');
const cam2 = criarCamera('C2', 'C′', COR.c2, '′');

// Ponto 3D ----------------------------------------------------------------------------
const ponto = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 24), new THREE.MeshLambertMaterial({ color: COR.ponto }));
ponto.userData.alvo = 'X';
cena.add(ponto);
pegaveis.push(ponto);
const rotPonto = rotulo('X', COR.ponto, 0.32);
cena.add(rotPonto);

// Raios, linha de base e plano epipolar ---------------------------------------------------
const raio1 = linha(COR.c1, { opacidade: 0.8 });
const raio2 = linha(COR.c2, { opacidade: 0.8 });
const linhaBase = linha(COR.base, { tracejada: true, opacidade: 0.7 });
cena.add(raio1, raio2, linhaBase);

const geoPlanoEpi = new THREE.BufferGeometry();
geoPlanoEpi.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(3 * 32), 3));
const planoEpi = new THREE.Mesh(geoPlanoEpi, new THREE.MeshBasicMaterial({
  color: COR.plano, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false
}));
planoEpi.frustumCulled = false;
cena.add(planoEpi);

const contornoEpi = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: COR.epi, transparent: true, opacity: 0.6 }));
contornoEpi.frustumCulled = false;
cena.add(contornoEpi);

// Gizmo de manipulação --------------------------------------------------------------------
const gizmo = new TransformControls(observador, renderer.domElement);
gizmo.setSize(0.75);
cena.add(gizmo.getHelper());
gizmo.addEventListener('dragging-changed', e => { orbita.enabled = !e.value; });
gizmo.addEventListener('objectChange', atualizar);

// Geometria ---------------------------------------------------------------------------------
function homog(P) {           // x = K P (coordenadas de pixel homogêneas)
  return [K.fx * P.x + K.cx * P.z, K.fy * P.y + K.cy * P.z, P.z];
}
function cruz(a, b) {
  return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
}
function pixelParaLocal(u, v) {
  return new THREE.Vector3((u - K.cx) / K.fx * D_PLANO, (v - K.cy) / K.fy * D_PLANO, D_PLANO);
}
function recortarReta(l) {   // reta a u + b v + c = 0 recortada ao retângulo da imagem
  const n = Math.hypot(l[0], l[1]);
  if (n < 1e-12) return null;
  const [a, b, c] = l.map(x => x / n);
  const pts = [];
  const tol = 1e-6;
  if (Math.abs(b) > 1e-12) for (const u of [0, W]) { const v = -(a * u + c) / b; if (v >= -tol && v <= H + tol) pts.push([u, v]); }
  if (Math.abs(a) > 1e-12) for (const v of [0, H]) { const u = -(b * v + c) / a; if (u >= -tol && u <= W + tol) pts.push([u, v]); }
  let melhor = null, dmax = -1;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i][0] - pts[j][0], pts[i][1] - pts[j][1]);
    if (d > dmax) { dmax = d; melhor = [pts[i], pts[j]]; }
  }
  return dmax > 1e-6 ? melhor : null;
}

let verPlano = true, verLinhas = true;

function processarCamera(cam, Xw, Coutro) {
  const g = cam.grupo;
  const Xl = g.worldToLocal(Xw.clone());
  const Ol = g.worldToLocal(Coutro.clone());   // centro da outra câmera neste sistema
  const xh = homog(Xl), eh = homog(Ol);
  const r = { xh, eh, x: null, e: null, eInf: false, reta: null, mundo: [] };

  // projeção de X
  if (Xl.z > 1e-6) {
    r.x = [xh[0] / xh[2], xh[1] / xh[2]];
    cam.projX.position.copy(Xl).multiplyScalar(D_PLANO / Xl.z);
    cam.rotX.position.copy(cam.projX.position).add(new THREE.Vector3(0.07, -0.08, 0));
  }
  cam.projX.visible = cam.rotX.visible = !!r.x;

  // epipolo: imagem do centro da outra câmera
  let e3 = null;
  if (Math.abs(Ol.z) > 1e-6) {
    r.e = [eh[0] / eh[2], eh[1] / eh[2]];
    e3 = Ol.clone().multiplyScalar(D_PLANO / Ol.z);
    if (e3.length() > LIMITE_EPIPOLO) e3 = null;
  } else {
    r.eInf = true;
  }
  cam.epipolo.visible = cam.rotE.visible = !!e3;
  if (e3) {
    cam.epipolo.position.copy(e3);
    cam.rotE.position.copy(e3).add(new THREE.Vector3(-0.09, -0.1, 0));
    r.mundo.push(g.localToWorld(e3.clone()));
  }

  // linha epipolar: reta que passa por e e x  (l = e × x)
  const seg = recortarReta(cruz(eh, xh));
  if (seg) {
    r.reta = seg;
    const a = pixelParaLocal(...seg[0]), b = pixelParaLocal(...seg[1]);
    definirLinha(cam.linhaEpi, a, b);
    r.mundo.push(g.localToWorld(a.clone()), g.localToWorld(b.clone()));
  }
  cam.linhaEpi.visible = !!seg && verLinhas;
  return r;
}

function envoltoria(pts) {   // envoltória convexa 2D (monotone chain)
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const giro = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const inf = [], sup = [];
  for (const q of p) { while (inf.length >= 2 && giro(inf[inf.length - 2], inf[inf.length - 1], q) <= 0) inf.pop(); inf.push(q); }
  for (const q of p.slice().reverse()) { while (sup.length >= 2 && giro(sup[sup.length - 2], sup[sup.length - 1], q) <= 0) sup.pop(); sup.push(q); }
  return inf.slice(0, -1).concat(sup.slice(0, -1));
}

let ultimo = null;

function atualizar() {
  cam1.grupo.updateMatrixWorld(true);
  cam2.grupo.updateMatrixWorld(true);
  const Xw = ponto.position.clone();
  const C1 = cam1.grupo.position.clone(), C2 = cam2.grupo.position.clone();

  rotPonto.position.copy(Xw).add(new THREE.Vector3(0.18, -0.2, 0));
  definirLinha(raio1, Xw, C1);
  definirLinha(raio2, Xw, C2);

  const r1 = processarCamera(cam1, Xw, C2);
  const r2 = processarCamera(cam2, Xw, C1);

  // linha de base (estendida até os epipolos, quando estão próximos)
  const u = C2.clone().sub(C1);
  const baseLen = u.length();
  u.normalize();
  const sobreBase = [C1, C2, ...[cam1, cam2].filter(c => c.epipolo.visible).map(c => c.grupo.localToWorld(c.epipolo.position.clone()))];
  const ts = sobreBase.map(p => p.clone().sub(C1).dot(u));
  definirLinha(linhaBase, C1.clone().addScaledVector(u, Math.min(...ts)), C1.clone().addScaledVector(u, Math.max(...ts)));

  // plano epipolar: envoltória de X, C, C', epipolos e linhas epipolares
  const n = new THREE.Vector3().crossVectors(u, Xw.clone().sub(C1));
  const degenerado = n.length() < 1e-4;
  if (!degenerado) {
    n.normalize();
    const v = new THREE.Vector3().crossVectors(n, u);
    const pts3 = [Xw, C1, C2, ...r1.mundo, ...r2.mundo];
    const pts2 = pts3.map(p => { const d = p.clone().sub(C1); return [d.dot(u), d.dot(v)]; });
    const env = envoltoria(pts2).map(([a, b]) => C1.clone().addScaledVector(u, a).addScaledVector(v, b));
    const pos = geoPlanoEpi.attributes.position;
    env.slice(0, 32).forEach((p, k) => pos.setXYZ(k, p.x, p.y, p.z));
    pos.needsUpdate = true;
    const idx = [];
    for (let k = 1; k < Math.min(env.length, 32) - 1; k++) idx.push(0, k, k + 1);
    geoPlanoEpi.setIndex(idx);
    contornoEpi.geometry.setFromPoints(env);
  }
  planoEpi.visible = contornoEpi.visible = verPlano && !degenerado;

  ultimo = { r1, r2, baseLen, Xw };
  desenharImagem(ctx1, r1, COR.c1, '');
  desenharImagem(ctx2, r2, COR.c2, '′');
  atualizarInfo();
}

// Imagens 2D ---------------------------------------------------------------------------------
const ctx1 = document.getElementById('img1').getContext('2d');
const ctx2 = document.getElementById('img2').getContext('2d');

function setaBorda(ctx, dx, dy, texto) {
  // seta na borda da imagem apontando para um epipolo fora dela
  const cx = W / 2, cy = H / 2, m = 22;
  const n = Math.hypot(dx, dy);
  if (n < 1e-12) return;
  dx /= n; dy /= n;
  const t = Math.min(dx !== 0 ? (dx > 0 ? (W - m - cx) / dx : (m - cx) / dx) : Infinity,
                     dy !== 0 ? (dy > 0 ? (H - m - cy) / dy : (m - cy) / dy) : Infinity);
  const px = cx + dx * t, py = cy + dy * t;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(Math.atan2(dy, dx));
  ctx.fillStyle = COR.epi;
  ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-8, -11); ctx.lineTo(-8, 11); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.font = 'italic 28px "Cambria Math", serif';
  ctx.fillStyle = COR.epi;
  ctx.textAlign = px > W / 2 ? 'right' : 'left';
  ctx.textBaseline = py > H / 2 ? 'bottom' : 'top';
  ctx.fillText(texto, px + (px > W / 2 ? -22 : 22), py + (py > H / 2 ? -30 : 30));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function desenharImagem(ctx, r, cor, sufixo) {
  ctx.fillStyle = '#1c1d24';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let u = 80; u < W; u += 80) { ctx.beginPath(); ctx.moveTo(u, 0); ctx.lineTo(u, H); ctx.stroke(); }
  for (let v = 80; v < H; v += 80) { ctx.beginPath(); ctx.moveTo(0, v); ctx.lineTo(W, v); ctx.stroke(); }

  // ponto principal
  ctx.strokeStyle = 'rgba(224,122,176,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(K.cx - 10, K.cy); ctx.lineTo(K.cx + 10, K.cy);
  ctx.moveTo(K.cx, K.cy - 10); ctx.lineTo(K.cx, K.cy + 10);
  ctx.stroke();

  // linha epipolar
  if (r.reta && verLinhas) {
    ctx.strokeStyle = COR.epi;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(...r.reta[0]); ctx.lineTo(...r.reta[1]); ctx.stroke();
  }

  // epipolo
  const dentro = r.e && r.e[0] >= 0 && r.e[0] < W && r.e[1] >= 0 && r.e[1] < H;
  if (dentro) {
    ctx.strokeStyle = COR.epi; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(r.e[0], r.e[1], 13, 0, 2 * Math.PI); ctx.stroke();
    ctx.fillStyle = COR.epi; ctx.font = 'italic 28px "Cambria Math", serif';
    ctx.fillText('e' + sufixo, r.e[0] + 16, r.e[1] - 14);
  } else if (r.e) {
    setaBorda(ctx, r.e[0] - W / 2, r.e[1] - H / 2, `e${sufixo} fora da imagem`);
  } else if (r.eInf) {
    setaBorda(ctx, r.eh[0], r.eh[1], `e${sufixo} no infinito`);
  }

  // projeção de X
  if (r.x) {
    ctx.fillStyle = cor;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x[0], r.x[1], 10, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = 'italic 28px "Cambria Math", serif';
    ctx.fillText('x' + sufixo, r.x[0] + 14, r.x[1] + 26);
  } else {
    ctx.fillStyle = '#d9dbe6'; ctx.font = '22px sans-serif';
    ctx.fillText('X está atrás da câmera', 16, H - 18);
  }
}

// Painel -------------------------------------------------------------------------------------
const el = id => document.getElementById(id);
const fmt = v => v.toFixed(2);
function textoEpipolo(r) {
  if (r.eInf) return 'no infinito';
  return `(${r.e[0].toFixed(0)}, ${r.e[1].toFixed(0)}) px`;
}
function atualizarInfo() {
  const { r1, r2, baseLen, Xw } = ultimo;
  el('info').innerHTML =
    `<tr><td class="mat">X</td><td>(${fmt(Xw.x)}, ${fmt(Xw.y)}, ${fmt(Xw.z)})</td></tr>` +
    `<tr><td class="mat">e</td><td>${textoEpipolo(r1)}</td></tr>` +
    `<tr><td class="mat">e′</td><td>${textoEpipolo(r2)}</td></tr>` +
    `<tr><td>base</td><td>‖<span class="mat">C′ − C</span>‖ = ${fmt(baseLen)}</td></tr>`;
}

const objetos = { X: ponto, C1: cam1.grupo, C2: cam2.grupo };
let selecionado = 'X';

function modo(m) {
  gizmo.setMode(m);
  el('modo-mover').classList.toggle('ativo', m === 'translate');
  el('modo-girar').classList.toggle('ativo', m === 'rotate');
}
function selecionar(alvo) {
  selecionado = alvo;
  gizmo.attach(objetos[alvo]);
  ['X', 'C1', 'C2'].forEach(a => el('sel-' + a).classList.toggle('ativo', a === alvo));
  el('modo-girar').disabled = alvo === 'X';
  if (alvo === 'X') modo('translate');
}
['X', 'C1', 'C2'].forEach(a => el('sel-' + a).addEventListener('click', () => selecionar(a)));
el('modo-mover').addEventListener('click', () => modo('translate'));
el('modo-girar').addEventListener('click', () => { if (selecionado !== 'X') modo('rotate'); });

el('ver-plano').addEventListener('click', () => {
  verPlano = !verPlano;
  el('ver-plano').classList.toggle('ativo', verPlano);
  atualizar();
});
el('ver-linhas').addEventListener('click', () => {
  verLinhas = !verLinhas;
  el('ver-linhas').classList.toggle('ativo', verLinhas);
  atualizar();
});

function resetar() {
  ponto.position.copy(INICIAL.X);
  cam1.grupo.position.copy(INICIAL.C1);
  cam2.grupo.position.copy(INICIAL.C2);
  cam1.grupo.lookAt(INICIAL.alvo);
  cam2.grupo.lookAt(INICIAL.alvo);
  modo('translate');
  selecionar('X');
  atualizar();
}
el('resetar').addEventListener('click', resetar);

// Seleção com clique na cena
const raycaster = new THREE.Raycaster();
let inicioClique = null;
renderer.domElement.addEventListener('pointerdown', e => {
  inicioClique = (gizmo.axis === null) ? [e.clientX, e.clientY] : null;
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!inicioClique || Math.hypot(e.clientX - inicioClique[0], e.clientY - inicioClique[1]) > 4) return;
  const ret = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - ret.left) / ret.width) * 2 - 1, -((e.clientY - ret.top) / ret.height) * 2 + 1);
  raycaster.setFromCamera(ndc, observador);
  const hit = raycaster.intersectObjects(pegaveis, false)[0];
  if (hit) selecionar(hit.object.userData.alvo);
});

// Integração com o revealjs -------------------------------------------------------------------
// Dentro de um iframe, as teclas não chegam ao revealjs. Repassa as teclas de
// navegação ao slide pai (quando ele for acessível) e devolve o foco a ele.
const navegacao = { ArrowRight: 'right', ArrowLeft: 'left', ArrowDown: 'down', ArrowUp: 'up',
                    PageDown: 'next', PageUp: 'prev', ' ': 'next' };
document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  const acao = navegacao[e.key];
  if (!acao) return;
  try {
    const R = window.parent !== window && window.parent.Reveal;
    if (!R) return;
    e.preventDefault();
    window.parent.focus();
    R[acao]();
  } catch (_) { /* página pai inacessível (ex.: aberta via file://) */ }
});

// Laço de renderização ------------------------------------------------------------------------
function redimensionar() {
  const w = container.clientWidth, hh = container.clientHeight;
  renderer.setSize(w, hh, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = hh + 'px';
  observador.aspect = w / hh;
  observador.updateProjectionMatrix();
}
new ResizeObserver(redimensionar).observe(container);

function animar() {
  orbita.update();
  renderer.render(cena, observador);
  requestAnimationFrame(animar);
}

redimensionar();
resetar();
animar();
})();
</script>
</body>
</html>

<svg width="1400" height="380" viewBox="0 0 1400 380" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pipeline de reconhecimento de objetos com momentos de Hu</title>
<desc>Cinco quadros emoldurados mostrando objetos originais, imagem binarizada em fundo preto, objetos rotulados coloridos em fundo preto, calculo de momentos e classificacao final em banana, maca e morango.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1400" height="380" fill="#FFFFFF"/>

<!-- Molduras -->
<rect x="20" y="50" width="220" height="260" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
<rect x="300" y="50" width="220" height="260" rx="10" fill="#000000" stroke="#B4B2A9" stroke-width="1.5"/>
<rect x="580" y="50" width="220" height="260" rx="10" fill="#000000" stroke="#B4B2A9" stroke-width="1.5"/>
<rect x="860" y="50" width="140" height="260" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>
<rect x="1060" y="50" width="320" height="260" rx="10" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/>

<!-- Panel 1: objetos originais (cinza sobre branco) -->
<g fill="#D3D1C7" stroke="#888780" stroke-width="1">
<path d="M 102,116 Q 122,90 156,104 Q 144,126 102,116 Z"/>
<circle cx="130" cy="190" r="20"/>
<path d="M 112,260 Q 108,286 130,294 Q 152,286 148,260 Q 130,250 112,260 Z"/>
</g>

<!-- Panel 2: binarizacao (branco sobre preto) -->
<g fill="#FFFFFF">
<path d="M 382,116 Q 402,90 436,104 Q 424,126 382,116 Z"/>
<circle cx="410" cy="190" r="20"/>
<path d="M 392,260 Q 388,286 410,294 Q 432,286 428,260 Q 410,250 392,260 Z"/>
</g>

<!-- Panel 3: rotulacao (colorido sobre preto + numeros) -->
<path d="M 662,116 Q 682,90 716,104 Q 704,126 662,116 Z" fill="#FAC775"/>
<circle cx="690" cy="190" r="20" fill="#97C459"/>
<path d="M 672,260 Q 668,286 690,294 Q 712,286 708,260 Q 690,250 672,260 Z" fill="#F09595"/>
<g fill="#FFFFFF" stroke="#000000" stroke-width="1">
<circle cx="722" cy="86" r="13"/>
<circle cx="714" cy="170" r="13"/>
<circle cx="716" cy="246" r="13"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#000000" text-anchor="middle">
<text x="722" y="91">1</text>
<text x="714" y="175">2</text>
<text x="716" y="251">3</text>
</g>

<!-- Panel 4: sigma (calculo de momentos) -->
<circle cx="930" cy="190" r="46" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
<text x="930" y="190" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#26215C" text-anchor="middle" dominant-baseline="central">&#931;</text>

<!-- Panel 5: classificacao (cores por classe) -->
<path d="M 1082,116 Q 1102,90 1136,104 Q 1124,126 1082,116 Z" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
<circle cx="1110" cy="190" r="20" fill="#F0997B" stroke="#712B13" stroke-width="1"/>
<path d="M 1092,260 Q 1088,286 1110,294 Q 1132,286 1128,260 Q 1110,250 1092,260 Z" fill="#ED93B1" stroke="#72243E" stroke-width="1"/>

<g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="start">
<text x="1160" y="107" fill="#633806">banana</text>
<text x="1160" y="195" fill="#712B13">ma&#231;&#227;</text>
<text x="1160" y="275" fill="#72243E">morango</text>
</g>

<!-- Setas -->
<line x1="250" y1="190" x2="290" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530" y1="190" x2="570" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="810" y1="190" x2="850" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="1010" y1="190" x2="1050" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Legendas -->
<g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#444441" text-anchor="middle">
<text x="130" y="338">Imagem original</text>
<text x="410" y="338">Binariza&#231;&#227;o</text>
<text x="690" y="338">Rotula&#231;&#227;o</text>
<text x="930" y="338">Momentos de Hu</text>
<text x="1220" y="338">Classifica&#231;&#227;o</text>
</g>
</svg>
